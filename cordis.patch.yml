# dsh-llm-provider 的 bundle patch 层。
#
# 按 cordis 的 patch 语义写：顶层数组，`- id: <行 id>` 定向覆盖（`disabled: true` 禁用它），
# `- insert: [...]` 往插件树里插行。插进来的行按顺序建索引，后面的 patch 还能指向它。
# 命不中的 id，dsh 只警告并跳过（@deepseek-ai/cordis-plugin-include 的语义）——所以本文件
# 挂到不含这些行的 profile 上也安全。
#
# 本插件要接管的官方行在这里禁用，但**只在本插件自己被启用时**（disabled 是 !!js 表达式，
# 由 Loader 求值）：用户在插件管理里关掉本插件（而不是卸载）时，那四行会自动恢复，
# 模型照旧能用。表达式读 loader 的条目列表找本插件那一行，取反它的 disabled；
# 任何异常一律返回 false（不禁用官方行）——失败时宁可让官方插件可用，
# 也不要出现「插件关了、官方也被禁着、一个模型都没有」这种死角。
#
# 本插件要接管的官方行有：
#
# 1) llm-pi-ai：ctx.llm.registerAdapter 对同名路由直接抛 DUPLICATE_ADAPTER，没有遮蔽机制，
#    桥接要接手路由只能在这一层禁用官方行。本插件内部的桥接副本接管它的全部行为
#    （settings 段、模型发现、模型选择器目录），对用户不可见地换到新版 pi-ai。
# 2) llm-deepseek：DeepSeek 统一走 pi-ai 的 deepseek 路由，全世界只留 pi-ai 一套 adapter。
#    那条路由由下面的 config 声明（复用 DEEPSEEK_API_KEY）。
# 3) ui-model-selection：模型选择器整体由本插件接管（座位 + /model 命令 + 目录状态机）。
#    座位本身可以用负 priority 遮蔽（本插件仍留着 priority: -10），但那样官方插件还在跑：
#    它会再拉一份目录、还会推 composer 的「当前模型不可路由」置灰状态，两套状态机并存只会
#    互相打架。整行禁用后，我们自己的目录路径就是唯一路径。核对过 client/ 全量引用：没有
#    别的插件依赖它提供的 modelDirectories 服务，禁掉不会让谁卡在 pending。
# 4) ui-settings-models：官方 Models 页禁用，「配置+展示一体」在本插件的「模型服务」标签里做。
#    它独有的逐模型清单编辑（ModelListEditor / DeepSeekModelsEditor / CustomProviderCard）
#    没有替代——记在 README「已知缺口」一节。
- id: llm-pi-ai
  disabled: !!js "(() => { try { const l = ctx.get('loader'); const rows = l && l.entries ? [...l.entries()] : []; const mine = rows.find((e) => e && e.options && (e.options.id === 'dsh-llm-provider' || String(e.options.name || '').indexOf('@dsh-one/dsh-llm-provider') === 0)); return mine === undefined ? false : !mine.disabled } catch { return false } })()"

- id: llm-deepseek
  disabled: !!js "(() => { try { const l = ctx.get('loader'); const rows = l && l.entries ? [...l.entries()] : []; const mine = rows.find((e) => e && e.options && (e.options.id === 'dsh-llm-provider' || String(e.options.name || '').indexOf('@dsh-one/dsh-llm-provider') === 0)); return mine === undefined ? false : !mine.disabled } catch { return false } })()"

- id: ui-model-selection
  disabled: !!js "(() => { try { const l = ctx.get('loader'); const rows = l && l.entries ? [...l.entries()] : []; const mine = rows.find((e) => e && e.options && (e.options.id === 'dsh-llm-provider' || String(e.options.name || '').indexOf('@dsh-one/dsh-llm-provider') === 0)); return mine === undefined ? false : !mine.disabled } catch { return false } })()"

- id: ui-settings-models
  disabled: !!js "(() => { try { const l = ctx.get('loader'); const rows = l && l.entries ? [...l.entries()] : []; const mine = rows.find((e) => e && e.options && (e.options.id === 'dsh-llm-provider' || String(e.options.name || '').indexOf('@dsh-one/dsh-llm-provider') === 0)); return mine === undefined ? false : !mine.disabled } catch { return false } })()"

- insert:
    - id: dsh-llm-provider
      name: '@dsh-one/dsh-llm-provider'
      # providers 不在这里声明：内置默认（DeepSeek 那条）放在 src/provider-config.ts 的
      # BUILTIN_PROVIDERS 里，因为 0.2.x 宿主把我们条目的 config 同时当成「界面写配置的落点」，
      # 默认值和用户写入混在同一个键里就没法分优先级了。写配置由 /provider/mutate 按宿主版本
      # 选路（0.1.x 写 settings 的 llm-pi-ai 段，0.2.x 写 profile patch 里本条目）。
